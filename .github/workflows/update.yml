name: Update playoff tracker

on:
  schedule:
    # 0:00, 5:00, 20:00 UTC = 5pm, 10pm, 1pm Pacific (PDT)
    - cron: '0 0,5,20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tracker
        run: python tracker.py
        - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python discord_post.py

      - name: Commit and push results
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add docs/ player_map.json
          git commit -m "auto-update" || echo "nothing to commit"
          git push
