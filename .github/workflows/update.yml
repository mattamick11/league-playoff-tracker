name: Update playoff tracker

# Queue overlapping runs instead of racing them. GitHub's scheduler can deliver a
# run 90+ minutes late (measured), so at a 30-minute cadence two runs can overlap
# and both try to push, failing the second on a non-fast-forward.
concurrency:
  group: tracker
  cancel-in-progress: false

on:
  schedule:
    # Every 30 minutes across the MLB day, in UTC.
    # Verified against the real Aug 5-11 2026 schedule: earliest first pitch
    # 16:15 UTC (Sunday), latest game ends about 05:45 UTC the next day.
    # That is 9:00am to 11:00pm Pacific.
    - cron: '*/30 16-23 * * *'
    - cron: '*/30 0-6 * * *'
    # DISABLED 2026-08-04 (no auto-commentary until the API key exists) - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      commentary:
        description: 'Also write the nightly commentary? (leave none while disabled)'
        required: false
        default: 'none'
        type: choice
        options: ['none', 'nightly']
      post_recap:
        description: 'Post the committed recap.md to Discord?'
        required: false
        default: 'off'
        type: choice
        options: ['off', 'dry-run', 'post']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tracker
        run: python tracker.py

      # Standings snapshot. Runs on EVERY run, but discord_post.py self-gates to
      # four slots a day (1pm/4pm/7pm/10pm Pacific) via docs/last_discord_post.json.
      # It must run BEFORE the commit so that marker file is persisted, otherwise
      # the next run would post the same slot again.
      - name: Post standings to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python discord_post.py

      # Commentary is disabled; manual runs can still force it via the dropdown.
      - name: Pick commentary mode
        id: mode
        run: |
          MODE="none"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.commentary }}"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "commentary mode: $MODE"

      - name: Generate commentary
        if: steps.mode.outputs.mode == 'nightly'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python commentary.py --mode nightly

      # Commit BEFORE the recap steps. A recap failure must never cost us the
      # stats update that tracker.py just spent a minute producing.
      - name: Commit and push results
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add docs/ player_map.json
          git commit -m "auto-update${{ steps.mode.outputs.mode == 'nightly' && ' + nightly commentary' || '' }}" || echo "nothing to commit"
          git push

      # Manual-only. Posts the reviewed recap.md. Fails closed on anything odd.
      - name: Preview recap (no posting)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.post_recap == 'dry-run'
        run: python post_recap.py --dry-run

      - name: Post recap to Discord
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.post_recap == 'post'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python post_recap.py
