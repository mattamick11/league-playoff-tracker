name: Update playoff tracker

on:
  schedule:
    # Stats-only refreshes: 1pm, 5pm, 10pm Pacific (PDT = UTC-7)
    - cron: '0 20 * * *'
    - cron: '0 0 * * *'
    - cron: '0 5 * * *'
    # Morning preview: 8:05am Pacific
    - cron: '5 15 * * *'
    # Nightly recap: 11:35pm Pacific (most games final)
    - cron: '35 6 * * *'
  workflow_dispatch:
    inputs:
      commentary:
        description: 'Commentary to generate with this run'
        required: false
        default: 'none'
        type: choice
        options: [none, preview, recap]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tracker
        run: python tracker.py

      # Decide whether this run also writes commentary, and which kind.
      # Scheduled runs are chosen by cron; manual runs use the dropdown.
      - name: Pick commentary mode
        id: mode
        run: |
          MODE="none"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.commentary }}"
          elif [ "${{ github.event.schedule }}" = "5 15 * * *" ]; then
            MODE="preview"
          elif [ "${{ github.event.schedule }}" = "35 6 * * *" ]; then
            MODE="recap"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "commentary mode: $MODE"

      - name: Generate commentary
        if: steps.mode.outputs.mode != 'none'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python commentary.py --mode "${{ steps.mode.outputs.mode }}"

      - name: Commit and push results
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add docs/ player_map.json
          git commit -m "auto-update${{ steps.mode.outputs.mode != 'none' && format(' + {0}', steps.mode.outputs.mode) || '' }}" || echo "nothing to commit"
          git push
